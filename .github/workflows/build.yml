name: Build extension

# Every push and pull request: check the code and build the extension zip
# (downloadable from the run's "Artifacts").
# Tag v* (e.g. v1.2.0): also publish it as a GitHub Release, so people can
# download it and load it in Chrome with "Load unpacked".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check manifest and scripts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          for f in *.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('lib/cedict.json','utf8')); JSON.parse(require('fs').readFileSync('lib/hanzi.json','utf8'))"

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./manifest.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $v"
            exit 1
          fi

      - name: Package
        run: |
          name="xiaopin-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$name"
          cp manifest.json background.js content.js inject.js subtitles.js \
             options.html options.js overlay.css LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cp -r lib assets icons "dist/$name/"
          cat > "dist/$name/INSTALL.txt" <<'EOF'
          Xiaopin - Pinyin Subtitles

          1. Open chrome://extensions (or edge://extensions, brave://extensions).
          2. Turn on "Developer mode".
          3. Click "Load unpacked" and select this folder.
          4. Click the extension icon to add an OpenRouter or Anthropic API key
             if you want AI translation (optional).
          EOF
          (cd dist && zip -qr "$name.zip" "$name")
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"
          echo "DIR=dist/$name" >> "$GITHUB_ENV"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: xiaopin-${{ steps.version.outputs.version }}
          path: ${{ env.DIR }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download **xiaopin-${{ steps.version.outputs.version }}.zip** below and unzip it.
            2. Open `chrome://extensions`, turn on **Developer mode**.
            3. Click **Load unpacked** and pick the unzipped `xiaopin-${{ steps.version.outputs.version }}` folder.
