<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Xiaopin, the red panda">
  <!-- Xiaopin 小拼: original red panda mascot -->
  <!-- ears -->
  <path d="M20 46 C16 22 30 12 46 26 C40 34 30 40 20 46Z" fill="#b8391f"/>
  <path d="M108 46 C112 22 98 12 82 26 C88 34 98 40 108 46Z" fill="#b8391f"/>
  <path d="M25 40 C24 27 31 22 40 29 C35 33 30 36 25 40Z" fill="#3a1d16"/>
  <path d="M103 40 C104 27 97 22 88 29 C93 33 98 36 103 40Z" fill="#3a1d16"/>
  <!-- head -->
  <ellipse cx="64" cy="70" rx="48" ry="42" fill="#ec6a3c"/>
  <ellipse cx="64" cy="60" rx="40" ry="28" fill="#f27c48"/>
  <!-- white eyebrow spots -->
  <ellipse cx="44" cy="52" rx="8" ry="5.5" fill="#fff7ee"/>
  <ellipse cx="84" cy="52" rx="8" ry="5.5" fill="#fff7ee"/>
  <!-- tear stripes -->
  <path d="M42 70 C38 82 36 92 40 102 C30 96 26 84 30 72Z" fill="#a8341c"/>
  <path d="M86 70 C90 82 92 92 88 102 C98 96 102 84 98 72Z" fill="#a8341c"/>
  <!-- white cheeks and muzzle -->
  <ellipse cx="36" cy="86" rx="14" ry="12" fill="#fff7ee"/>
  <ellipse cx="92" cy="86" rx="14" ry="12" fill="#fff7ee"/>
  <ellipse cx="64" cy="90" rx="22" ry="16" fill="#fff7ee"/>
  <!-- eyes -->
  <ellipse cx="47" cy="68" rx="6.5" ry="7.5" fill="#1e1311"/>
  <ellipse cx="81" cy="68" rx="6.5" ry="7.5" fill="#1e1311"/>
  <circle cx="49.5" cy="65" r="2.4" fill="#fff"/>
  <circle cx="83.5" cy="65" r="2.4" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="34" cy="84" rx="6" ry="3.5" fill="#ff9e8a" opacity="0.7"/>
  <ellipse cx="94" cy="84" rx="6" ry="3.5" fill="#ff9e8a" opacity="0.7"/>
  <!-- nose and mouth -->
  <path d="M57 81 Q64 77 71 81 Q68 88 64 89 Q60 88 57 81Z" fill="#1e1311"/>
  <path d="M64 89 L64 93 M64 93 Q58 99 53 95 M64 93 Q70 99 75 95" stroke="#1e1311" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
